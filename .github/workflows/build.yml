name: Build OpenWrt AX6 NSS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Firmware

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3.12-venv python3.12-dev rsync unzip zlib1g-dev file wget python3-pip python3-setuptools subversion

      - name: Setup Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace luci with immortalwrt versions
        run: |
          rm -rf feeds/luci/modules/luci-base
          rm -rf feeds/luci/modules/luci-mod-status
          svn export https://github.com/immortalwrt/luci/branches/master/modules/luci-base feeds/luci/modules/luci-base
          svn export https://github.com/immortalwrt/luci/branches/master/modules/luci-mod-status feeds/luci/modules/luci-mod-status

      - name: Copy AX6 config
        run: cp AX6.config .config

      - name: Download Sources
        run: make download -j$(nproc)

      - name: Build Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/targets/**/*/*.bin
            bin/targets/**/*.manifest
            bin/targets/**/*.buildinfo
            bin/targets/**/*.sha256sums
          prerelease: true
          draft: false

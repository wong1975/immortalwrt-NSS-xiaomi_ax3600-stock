name: Build OpenWrt AX6 NSS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile Firmware

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget subversion

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace LuCI with ImmortalWrt versions
        run: |
          rm -rf feeds/luci/modules/luci-base
          rm -rf feeds/luci/modules/luci-mod-status
          git clone --filter=blob:none --no-checkout https://github.com/immortalwrt/luci.git
          cd luci
          git sparse-checkout init --cone
          git sparse-checkout set modules/luci-base modules/luci-mod-status
          git checkout master
          cp -r modules/luci-base ../feeds/luci/modules/
          cp -r modules/luci-mod-status ../feeds/luci/modules/

      - name: Prepare Config
        run: |
          cp AX6.config .config
          make defconfig

      - name: Download Sources
        run: make download -j$(nproc)

      - name: Compile Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/targets/**/*/*.bin
            bin/targets/**/*.manifest
            bin/targets/**/*.buildinfo
            bin/targets/**/*.sha256sums
            .config
          draft: false
          prerelease: false
